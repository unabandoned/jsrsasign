name: publish

# NOT the org's reusable-publish.yml, and deliberately so: that workflow runs
# `npm publish` at the repository root, but jsrsasign's npm package has always
# been the `npm/` subdirectory (upstream published from there too), while the
# root holds the browser builds, API docs and QUnit pages. Same shape as
# unabandoned/regexper's publish.yml.
#
# Everything else follows reusable-publish: npm >= 11.5.1 for OIDC, no dev-tree
# install (npm/lib/ is committed, there is nothing to build), `--ignore-scripts`
# on every publish, and the try-OIDC-then-fall-back-to-token bootstrap that
# flips OIDC_ENABLED once trusted publishing works.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      # ---- Steady state: OIDC configured (flag set) -> tokenless publish ----
      - name: Publish via OIDC
        if: vars.OIDC_ENABLED == 'true'
        run: npm publish --provenance --access public --ignore-scripts

      # ---- Bootstrap (flag not set): try OIDC, fall back to token ----
      - name: Try OIDC publish
        id: oidc_try
        if: vars.OIDC_ENABLED != 'true'
        continue-on-error: true
        run: npm publish --provenance --access public --ignore-scripts

      - name: Bootstrap publish with token (OIDC not enabled yet)
        if: vars.OIDC_ENABLED != 'true' && steps.oidc_try.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
        run: |
          set -eu
          echo "OIDC not available yet; publishing with NPM_SECRET."
          echo "To enable OIDC, run this once locally with a 2FA-enabled account:"
          echo "  npm trust github @unabandoned/jsrsasign --repo $GITHUB_REPOSITORY --file publish.yml --allow-publish"
          echo "After that, the next release publishes via OIDC and sets OIDC_ENABLED automatically."
          npm publish --provenance --access public --ignore-scripts

      - name: Record OIDC flag (OIDC worked -> trusted publishing is live)
        if: vars.OIDC_ENABLED != 'true' && steps.oidc_try.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh variable set OIDC_ENABLED --repo "$GITHUB_REPOSITORY" --body true
